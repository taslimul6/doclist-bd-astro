name: Build and deploy (static)

on:
  push:
    branches: [main]
  schedule:
    # 18:00 UTC = 00:00 Asia/Dhaka. The daily release schedule is applied at build time, so rebuilding at
    # Dhaka midnight publishes that day's pages. GitHub may start scheduled runs a little late.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://doclist-bd.com
      - run: npm run test:search
      - name: Deploy static assets to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
